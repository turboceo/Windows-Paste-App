[package]
name = "windows-paste"
version = "0.2.0"
edition = "2021"
authors = ["Pyzl"]
description = "A modern clipboard history manager inspired by Paste for macOS, built in Rust and Slint."

[dependencies]
slint = { version = "1.9", default-features = true }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
directories = "5.0"
bytemuck = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
]

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
